services:
  - type: web
    name: one-click-analysis-backend
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements-prod.txt
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
